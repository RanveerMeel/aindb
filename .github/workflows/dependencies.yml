name: Dependencies

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Run on the host runner (not the cargo-deny-action container) so
      # rust-toolchain.toml resolves through the runner's rustup.
      - run: rustup show
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --all-features check advisories bans licenses sources
