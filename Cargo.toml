[workspace]
resolver = "2"
members = [
    "crates/aindb-model",
    "crates/aindb-protocol",
    "crates/aindb-policy",
    "crates/aindb-verify",
    "crates/aindb-audit",
    "crates/aindb-storage",
    "crates/aindb-engine",
    "crates/aindb-cdk",
    "crates/aindb-cli",
    "tests/acceptance",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
aindb-model = { path = "crates/aindb-model", version = "0.0.1" }
aindb-protocol = { path = "crates/aindb-protocol", version = "0.0.1" }
aindb-policy = { path = "crates/aindb-policy", version = "0.0.1" }
aindb-verify = { path = "crates/aindb-verify", version = "0.0.1" }
aindb-audit = { path = "crates/aindb-audit", version = "0.0.1" }
aindb-storage = { path = "crates/aindb-storage", version = "0.0.1" }
aindb-engine = { path = "crates/aindb-engine", version = "0.0.1" }
aindb-cdk = { path = "crates/aindb-cdk", version = "0.0.1" }
